<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크몽 업로드 미리보기 · 브랜딩 인큐베이팅</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --g900:#212224; --g800:#303441; --g700:#555969; --g600:#727585; --g500:#9A9BA7; --g400:#C4C5CF; --g300:#E4E5ED; --g200:#F2F3F7; --g100:#FAFAFC; --chip:#F4F5F6;
  --pur:#9647EB; --pur1:#F7F0FF; --pur3:#D5B1FB; --star:#00C471; --yel:#FFD400; --ed:#6D5BFF;
  --tb-h:52px; --panel-w:380px; --zoom:1; --mzoom:1;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--g900);background:#fff;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
p,h1,h2,h3,h4{margin:0}
img{display:block;max-width:100%}
.ic{flex:none;display:inline-block;vertical-align:middle}
#app{--pw:var(--panel-w)}
#app.panel-closed,#app.report{--pw:0px}
#app.report{--tb-h:0px}

/* ============ 편집기 UI ============ */
.tb{height:var(--tb-h);display:flex;align-items:center;gap:14px;padding:0 12px 0 14px;background:#16171A;color:#fff;position:relative;z-index:60}
.report .tb{display:none}
.tb-l{display:flex;align-items:center;gap:8px;min-width:0}
.tb-logo{width:26px;height:26px;border-radius:7px;background:var(--yel);color:#16171A;display:grid;place-items:center;font-weight:900;font-size:14px;flex:none}
.tb-l b{font-size:14px;white-space:nowrap}
.tb-sub{font-size:11px;color:#9A9BA7;border:1px solid #3a3b40;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tb-views{display:flex;background:#26272c;border-radius:9px;padding:3px;gap:2px;margin:0 auto}
.tb-views button,.tb-r button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border:0;border-radius:7px;background:transparent;color:#C9CAD3;font-size:13px;font-weight:600;white-space:nowrap}
.tb-views button.on{background:#fff;color:#16171A}
.tb-views button:not(.on):hover{color:#fff}
.tb-r{display:flex;gap:2px;align-items:center}
.tb-r button:hover{background:#2a2b31;color:#fff}
.tb-r button.on{background:#2f2a52;color:#fff;box-shadow:inset 0 0 0 1px var(--ed)}
.tb-r button.primary{background:var(--yel);color:#16171A}
.tb-r .tb-div{width:1px;height:20px;background:#34353b;margin:0 4px}
.work{display:flex;height:calc(100vh - var(--tb-h))}
.stage{flex:1;overflow:auto;position:relative;background:#fff;min-width:0}
.stage.mo-bg{background:#EDEFF3}
.zoomer{zoom:var(--zoom);min-width:1232px}
.panel{width:var(--panel-w);flex:none;border-left:1px solid #E6E7EE;background:#F7F8FA;overflow:auto}
.panel-closed .panel,.report .panel{display:none}

.pn-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #E6E7EE;position:sticky;top:0;background:#F7F8FA;z-index:3}
.pn-hd b{font-size:15px}
.pn-hd button{border:0;background:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--g700)}
.pn-hd button:hover{background:#ECEDF2}
.pn-body{padding:4px 12px 48px}
.pn-tip{font-size:12px;line-height:1.6;color:var(--g700);background:#FFF9DB;border:1px solid #F5E6A3;border-radius:10px;padding:10px 12px;margin-top:10px}
.pn-sec{background:#fff;border:1px solid #E9EAF0;border-radius:12px;padding:14px;margin-top:10px}
.pn-sec-hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pn-sec-hd b{font-size:14px}
.pn-count{font-size:12px;color:var(--g600);background:var(--g200);padding:2px 8px;border-radius:999px;white-space:nowrap}
.pn-count.over{background:#FFEDEF;color:#E5354B}
.pn-spec{font-size:12px;line-height:1.65;color:var(--g600);margin:6px 0 10px}
.pn-spec b{color:var(--g900);font-weight:700}
.pn-spec em{font-style:normal;font-size:10px;color:var(--ed);background:#EFEDFF;padding:1px 5px;border-radius:4px;margin-left:2px;font-weight:700}
.pn-spec em.r{color:#0F8A6A;background:#E5F7F1}
.pn-drop{border:1.5px dashed #C9CBD6;border-radius:10px;padding:12px;text-align:center;font-size:11px;color:var(--g600);cursor:pointer;background:#FCFCFE;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s}
.pn-drop b{font-size:13px;color:var(--g900)}
.pn-drop:hover{border-color:var(--ed);background:#F6F4FF}
.dz-over{outline:3px solid var(--ed)!important;outline-offset:-3px;background-color:rgba(109,91,255,.08)!important}
.pn-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.pn-item{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid #ECEDF2;border-radius:10px;background:#fff}
.pn-item.drag-over{border-color:var(--ed);box-shadow:0 0 0 2px #E3DEFF}
.dragging{opacity:.35}
.pn-grip{cursor:grab;color:#B6B8C4;font-size:13px;letter-spacing:-3px;padding:0 3px 0 1px;user-select:none}
.pn-thumb{width:56px;height:42px;object-fit:cover;border-radius:6px;flex:none;background:var(--g200);display:grid;place-items:center;color:var(--g500)}
.pn-thumb.sq{width:42px;height:42px}
.pn-thumb.tall{width:42px;height:56px;object-position:top}
.pn-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pn-meta b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn-meta>span{font-size:11px;color:var(--g600)}
.pn-main{font-style:normal;font-size:10px;background:var(--yel);color:#16171A;border-radius:4px;padding:1px 5px;margin-right:4px}
.bdg{align-self:flex-start;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;line-height:1.5}
.bdg.ok{background:#E8F8EF;color:#0F9A55}
.bdg.warn{background:#FFF1E2;color:#D9640D}
.bdg.info{background:#EEF2FF;color:#4659D6}
.pn-btns{display:flex;gap:1px}
.pn-btns button{width:26px;height:26px;border:0;border-radius:6px;background:transparent;color:var(--g700);display:grid;place-items:center;padding:0}
.pn-btns button:hover{background:var(--g200);color:var(--g900)}
.armed{background:#FFEDEF!important;color:#E5354B!important;width:auto!important;padding:0 8px!important;font-size:11px!important;font-weight:700}
.pn-btn{height:36px;padding:0 12px;border:1px solid var(--g300);border-radius:8px;background:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pn-btn:hover{border-color:var(--g500)}
.pn-btn.primary{background:#16171A;color:#fff;border-color:#16171A}
.pn-btn.block{width:100%;margin-top:6px;flex-direction:column;height:auto;padding:9px 12px;gap:1px}
.pn-btn small{font-weight:400;font-size:11px;opacity:.7}
.pn-btn.danger{color:#E5354B}
.pn-btnrow{display:flex;gap:6px}
.pn-btnrow .pn-btn{flex:1;font-size:12px;padding:0 8px}
.pn-tg{display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:7px 0;cursor:pointer;line-height:1.4}
.pn-tg input{margin-top:2px;accent-color:var(--ed)}
.pn-tg small{display:block;font-size:11px;color:var(--g600)}
.pn-seg{display:flex;align-items:center;gap:6px;font-size:13px;padding:7px 0}
.pn-seg>span{margin-right:auto}
.pn-seg button{height:28px;padding:0 10px;border:1px solid var(--g300);background:#fff;border-radius:7px;font-size:12px}
.pn-seg button.on{background:#16171A;color:#fff;border-color:#16171A}
.pn-av{display:flex;align-items:center;gap:10px}

/* 페이지 위 편집 도구 */
.tools{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:flex-end;gap:4px;padding:8px;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,0) 55%);opacity:0;transition:opacity .15s;z-index:5}
.th:hover>.tools,.k-dimg:hover>.tools,.pf-img:hover>.tools,.l-img:hover>.tools{opacity:1}
.tools button{height:26px;padding:0 8px;border:0;border-radius:6px;background:rgba(255,255,255,.95);font-size:12px;font-weight:600;color:#16171A;display:inline-flex;align-items:center;gap:3px}
.tools button:hover{background:#fff;box-shadow:0 0 0 2px var(--ed)}
.tools button.del{color:#E5354B}
.tl-lbl{margin-right:auto;color:#fff;font-size:12px;font-weight:700;align-self:center;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.tools .bdg{position:absolute;right:8px;bottom:8px}
.ph{background:repeating-linear-gradient(135deg,#F2F3F7 0 12px,#EEEFF4 12px 24px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--g500);text-align:center;font-size:13px}
.ph b{font-size:14px;color:var(--g600);font-weight:600}
.ph small{font-size:11px;color:var(--g500)}
.ph.up{cursor:pointer;outline:1.5px dashed #B9BBC8;outline-offset:-1.5px}
.ph.up:hover{outline-color:var(--ed);color:var(--ed)}
.ph.up:hover b{color:var(--ed)}
.ph .ph-ic{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.08);color:var(--g700)}
.th{position:relative;overflow:hidden}
.th .safe{display:none;position:absolute;left:7.67%;right:7.67%;top:10.25%;bottom:10.25%;border:1.5px dashed #FF2E63;pointer-events:none;z-index:4;box-shadow:0 0 0 999px rgba(255,46,99,.14)}
.th .safe::after{content:"안전 여백 50px";position:absolute;left:0;top:-17px;font-size:10px;font-weight:700;color:#fff;background:#FF2E63;padding:0 4px;border-radius:3px;white-space:nowrap}
.show-guide .th .safe,.gd .th .safe{display:block}
.editing .ek[contenteditable]{outline:1px dashed rgba(109,91,255,.6);outline-offset:2px;border-radius:2px;cursor:text}
.editing .ek[contenteditable]:hover{background:rgba(109,91,255,.06)}
.editing .ek[contenteditable]:focus{outline:2px solid var(--ed);background:rgba(109,91,255,.07)}
.editing .ek:empty::before{content:"입력";color:#C4C5CF}
.chip-edit{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--g700)}
.chip-edit small{font-size:11px;color:var(--ed)}
.ed-mini{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border:1px dashed var(--ed);color:var(--ed);background:#F6F4FF;border-radius:7px;font-size:12px;font-weight:600;margin-top:12px}
.ed-x{border:0;background:none;color:#E5354B;font-size:12px;margin-left:8px;cursor:pointer}
#exit-report{position:fixed;left:16px;bottom:16px;z-index:80;display:none;height:34px;padding:0 14px;border:0;border-radius:999px;background:rgba(22,23,26,.85);color:#fff;font-size:12px;font-weight:600;opacity:.25;transition:.2s}
#exit-report:hover{opacity:1}
.report #exit-report{display:block}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#16171A;color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:80vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px}
#toast button{border:0;background:none;color:var(--yel);font-weight:800;font-size:13px;padding:0;cursor:pointer}
.k-gal-item[draggable=true],.k-dimg[draggable=true],.pf-img[draggable=true]{cursor:grab}
.k-gal-item.drag-over,.k-dimg.drag-over,.pf-img.drag-over{outline:3px solid var(--ed);outline-offset:-3px}
.k-gal-item.drag-over::after,.k-dimg.drag-over::after,.pf-img.drag-over::after{content:"여기로 이동";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ed);color:#fff;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;z-index:8;pointer-events:none}
.k-gal-manage{position:absolute;left:10px;bottom:10px;z-index:7;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border:0;border-radius:999px;background:rgba(22,23,26,.82);color:#fff;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.k-gal-manage:hover{background:var(--ed)}
.k-dbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:8px 10px 8px 14px;border:1px dashed #C9C2FF;background:#F7F5FF;border-radius:8px;font-size:13px;color:var(--g700)}
.k-dbar b{color:var(--g900)}
.k-dbar button,.pn-mini{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border:0;border-radius:7px;background:#16171A;color:#fff;font-size:12px;font-weight:700}
.k-dbar button:hover,.pn-mini:hover{background:var(--ed)}
.pn-mini{height:24px;padding:0 8px;font-size:11px}
/* 순서 · 삭제 보드 */
#so-ov{background:rgba(22,23,26,.55);overflow-y:auto;z-index:49}
.so{width:min(1180px,calc(100% - 40px));margin:28px auto;background:#fff;border-radius:16px;padding:26px 28px 30px;box-shadow:0 10px 40px rgba(0,0,0,.25);position:relative}
.so-hd{display:flex;align-items:center;gap:16px;padding-right:44px}
.so-hd h2{font-size:20px;font-weight:800;white-space:nowrap}
.so-tabs{display:flex;background:var(--g200);border-radius:10px;padding:3px;gap:2px}
.so-tabs button{height:32px;padding:0 14px;border:0;border-radius:8px;background:transparent;font-size:13px;font-weight:700;color:var(--g600)}
.so-tabs button.on{background:#fff;color:var(--g900);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.so-sub{font-size:13px;color:var(--g600);margin-top:10px;line-height:1.6}
.so-bar{display:flex;align-items:center;gap:8px;margin-top:16px;padding:10px 12px;background:var(--g100);border:1px solid var(--g200);border-radius:10px;font-size:13px;flex-wrap:wrap}
.so-bar label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:600}
.so-bar input{accent-color:var(--ed);width:16px;height:16px}
.so-bar .cnt{color:var(--g600);margin-right:auto}
.so-bar button{height:32px;padding:0 12px;border:1px solid var(--g300);background:#fff;border-radius:8px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.so-bar button.dark{background:#16171A;color:#fff;border-color:#16171A}
.so-bar button.red{color:#E5354B}
.so-bar button:disabled{opacity:.4;cursor:default}
.so-grid{display:grid;gap:16px;margin-top:16px}
.so-grid.t-thumbs{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.so-grid.t-details{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.so-card{position:relative;border:1.5px solid var(--g300);border-radius:12px;background:#fff;overflow:hidden;cursor:grab;transition:border-color .15s,box-shadow .15s}
.so-card:hover{border-color:var(--g500)}
.so-card.sel{border-color:var(--ed);box-shadow:0 0 0 3px #E3DEFF}
.so-card.drag-over{border-color:var(--ed);box-shadow:0 0 0 3px var(--ed)}
.so-img{background:var(--g200);display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
.t-thumbs .so-img{aspect-ratio:4/3}
.t-thumbs .so-img img{width:100%;height:100%;object-fit:cover}
.t-details .so-img{height:230px}
.t-details .so-img img{width:100%}
.so-num{position:absolute;left:8px;top:8px;min-width:28px;height:28px;padding:0 8px;border-radius:999px;background:rgba(22,23,26,.85);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center}
.so-main{position:absolute;left:42px;top:10px;background:var(--yel);color:#16171A;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px}
.so-chk{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.95);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.so-chk input{width:16px;height:16px;accent-color:var(--ed);margin:0;cursor:pointer}
.so-meta{padding:8px 10px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.so-meta b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.so-meta>span{font-size:11px;color:var(--g600)}
.so-btns{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px 10px 10px}
.so-btns button{white-space:nowrap;height:30px;border:1px solid var(--g300);background:#fff;border-radius:7px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:2px;padding:0}
.so-btns button:hover:not(:disabled){border-color:var(--ed);color:var(--ed)}
.so-btns button:disabled{opacity:.3;cursor:default}
.so-btns button.del{color:#E5354B}
.so-btns button.del:hover{border-color:#E5354B;color:#E5354B}
.so-empty{grid-column:1/-1;padding:56px 0;text-align:center;color:var(--g500);font-size:14px;border:1.5px dashed var(--g300);border-radius:12px;cursor:pointer}
.so-empty:hover{border-color:var(--ed);color:var(--ed)}

/* ============ 크몽 공통 ============ */
.km{font-family:var(--font);color:var(--g900);background:#fff;letter-spacing:-0.01em}
.k-wrap{width:1200px;margin:0 auto;padding:0 16px}
.k-hd{background:#fff;border-bottom:1px solid var(--g200);min-width:1200px}
.k-hd-top{height:76px;display:flex;align-items:center;gap:28px}
.k-logo{font-size:30px;font-weight:800;letter-spacing:-1.6px;color:var(--g900);line-height:1;padding-bottom:3px}
.k-search{flex:0 0 400px;height:48px;border:1px solid var(--g300);border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 22px;color:var(--g500);font-size:15px}
.k-search .ic{color:var(--g900)}
.k-hd-links{margin-left:auto;display:flex;align-items:center;gap:22px;font-size:13px;font-weight:500;color:var(--g800);white-space:nowrap}
.k-badge{font-style:normal;font-size:10px;color:#3D6BFF;background:#EAF0FF;border-radius:4px;padding:1px 4px;margin-left:3px}
.k-gnb{height:48px;display:flex;align-items:center;gap:26px;font-size:15px;font-weight:500;color:var(--g900)}
.k-gnb span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.k-gnb .r{margin-left:auto}
.k-gnb .k-ind{font-weight:600}
.k-gnb .k-ind .ic{color:#3D6BFF}
.k-sep{width:1px;height:16px;background:var(--g300);margin:0 -8px}
.k-btn-dark{height:36px;padding:0 16px;border:0;border-radius:4px;background:var(--g900);color:#fff;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.k-btn-dark.sm{height:34px;font-size:13px}
.k-btn-dark.lg,.k-btn-line.lg{height:48px;font-size:16px;width:100%}
.k-btn-line{height:36px;padding:0 16px;border-radius:4px;border:1px solid rgba(0,0,0,.1);background:#fff;color:#141414;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.chip{display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:999px;background:var(--chip);font-size:14px;color:var(--g700);white-space:nowrap}
.chip.sm{height:32px;padding:0 12px;color:#141414}
.k-chips{display:flex;flex-wrap:wrap;gap:8px}
.k-av{border-radius:50%;overflow:hidden;flex:none;background:#2C2D31;color:#fff;display:grid;place-items:center;font-weight:700}
.k-av img{width:100%;height:100%;object-fit:cover}

/* 히어로 */
.k-hero{position:relative;height:309px;overflow:hidden;overflow:clip;min-width:1200px;isolation:isolate;background:#fff}
.k-hero-bg{position:absolute;inset:-80px;z-index:-1;background-size:cover;background-position:center;opacity:.2;filter:blur(100px)}
.k-hero-bg.none{inset:0;background:linear-gradient(180deg,#F1F2F5,#F6F6F9);opacity:1;filter:none}
.k-hero-in{position:relative;width:1200px;margin:0 auto;padding:20px 16px;height:309px}
.k-hero-l{width:715px;height:269px;display:flex;flex-direction:column;justify-content:space-between}
.k-crumb-row{display:flex;justify-content:space-between;align-items:center;height:20px}
.k-crumb{display:flex;align-items:center;gap:2px;font-size:13px;color:var(--g700)}
.k-crumb .ic{color:var(--g600)}
.k-like{display:flex;align-items:center;gap:4px;font-size:14px}
.k-like b{font-weight:700;margin-right:14px}
.k-title{margin-top:20px;font-size:32px;line-height:43px;font-weight:700;color:var(--g900);letter-spacing:-0.02em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.k-rate{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:14px;cursor:pointer}

.k-seller{display:flex;align-items:center;justify-content:space-between;height:72px;padding:12px 20px;border-radius:8px;background:rgba(255,255,255,.3);box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.k-seller-l{display:flex;align-items:center;gap:12px;min-width:0}
.k-seller-l b{font-size:14px;font-weight:700}
.k-seller-info{font-size:13px;color:var(--g600);margin-top:2px;white-space:nowrap}
.k-seller-info i{display:inline-block;vertical-align:middle;width:1px;height:10px;background:var(--g400);margin:0 10px 2px}
.k-gal{position:absolute;left:825px;top:20px;height:269px}
.k-gal-clip{overflow:hidden;overflow:clip;width:1600px;height:269px;border-radius:8px 0 0 8px}
.k-gal-track{display:flex;gap:20px;transition:transform .35s ease}
.k-gal-item{width:359px;height:269px;border-radius:8px;flex:none;background:var(--g200)}
.k-gal-item img{width:100%;height:100%;object-fit:cover}
.k-gal-btn,.k-car-btn{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.16);display:grid;place-items:center;z-index:6;padding:0;color:var(--g900)}
.k-gal-btn.next{left:337px}
.k-gal-btn.prev{left:-16px}

/* 본문 */
.k-body{width:1200px;margin:0 auto;padding:0 16px 96px;display:flex;justify-content:space-between;align-items:flex-start}
.k-main{width:715px;min-width:0}
.k-side{width:359px;position:sticky;top:0;padding-top:32px;display:flex;flex-direction:column;gap:8px}
.k-recent{padding-top:64px}
.k-sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.k-sec h2,.k-recent h2{font-size:20px;line-height:30px;font-weight:700;color:var(--g900)}
.k-more-link{font-size:13px;font-weight:500;color:var(--g900);cursor:pointer}
.k-tabs{position:sticky;top:0;z-index:7;background:#fff;display:flex;gap:20px;border-bottom:1px solid var(--g300);margin-top:40px}
.k-tabs.first{margin-top:32px}
.k-tabs a{height:50px;display:flex;align-items:center;font-size:16px;color:var(--g600);cursor:pointer;position:relative;white-space:nowrap}
.k-tabs a.on{color:var(--g900);font-weight:700}
.k-tabs a.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--g900)}
.k-sec{padding-top:64px;scroll-margin-top:51px}
.k-sec>h2{margin-bottom:20px}
.k-rv-cards{display:flex;gap:12px;overflow:hidden}
.k-rv-card{flex:0 0 450px;display:flex;gap:12px;padding:20px;background:var(--g100);border-radius:8px}
.k-rv-av{width:36px;height:36px;border-radius:50%;background:#E9E3D8;color:#8A7B62;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.k-rv-b{min-width:0;flex:1}
.k-rv-top{display:flex;align-items:center;gap:4px}
.k-rv-top b{font-size:14px;font-weight:700}
.k-rv-name{font-size:12px;color:var(--g600);margin-top:1px}
.k-rv-text{margin-top:8px;font-size:14px;line-height:20px;max-height:40px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* 포트폴리오 캐러셀 */
.k-pf-car{position:relative}
.k-pf-vp{overflow:hidden;overflow:clip}
.k-pf-track{display:flex;gap:12px;transition:transform .35s ease}
.k-pfc{width:230px;flex:none;cursor:pointer}
.k-pfc-img{position:relative;width:230px;height:230px;border-radius:8px;overflow:hidden;background:var(--g200)}
.k-pfc-img img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .3s}
.k-pfc:hover .k-pfc-img img{transform:scale(1.05)}
.k-pfc-heart{position:absolute;top:10px;right:10px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));z-index:2}
.k-pfc-cat{margin-top:12px;font-size:12px;line-height:19px;color:var(--g500)}
.k-pfc-title{font-size:14px;font-weight:700;line-height:21px;color:var(--g900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.k-pfc-row{display:flex;align-items:center;gap:8px;margin-top:8px;min-width:0}
.k-lbl{font-size:12px;line-height:22px;color:var(--g700);background:var(--g200);border-radius:4px;width:51px;text-align:center;flex:none}
.k-pfc-row p{font-size:14px;color:var(--g700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.k-car-btn{top:115px}
.k-car-btn.next{right:-16px}
.k-car-btn.prev{left:-16px}
.k-pfc.add .k-pfc-img{display:flex}

/* 서비스 설명 */
.k-collapse{position:relative;max-height:560px;overflow:hidden}
.k-collapse::after{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(rgba(255,255,255,0),#fff);pointer-events:none}
.k-collapse.open,.k-collapse.short{max-height:none}
.k-collapse.open::after,.k-collapse.short::after{display:none}
.k-collapse.cimg{max-height:1300px}
.k-desc-txt{font-size:15px;line-height:1.8;color:var(--g900);white-space:pre-wrap;word-break:keep-all}
.k-desc-txt b{font-weight:700}
.k-more{width:100%;height:40px;margin-top:16px;border:1px solid var(--g300);border-radius:4px;background:#fff;font-size:15px;font-weight:500;color:#141414;display:flex;align-items:center;justify-content:center;gap:4px}
.k-more.hide{display:none}
.k-more.open .ic{transform:rotate(180deg)}
.k-more.bar{margin-top:0;border-radius:0 0 4px 4px}
.k-meta{margin-top:40px}
.k-meta-t{font-size:14px;font-weight:700;color:var(--g800);margin-bottom:16px}
.k-details{margin-top:40px}
.k-dimg{position:relative;background:var(--g200)}
.k-dimg img{width:100%}
.k-dimg.ph{height:440px}
.k-dadd{margin-top:12px;height:64px;border:1.5px dashed #B9BBC8;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--g700);font-size:14px;font-weight:600;cursor:pointer}
.k-dadd>span{font-weight:400;font-size:12px;color:var(--g500);margin-left:6px}
.k-dadd:hover{border-color:var(--ed);color:var(--ed)}

/* 가격 */
.k-pbox{border:1px solid var(--pur3);background:var(--pur1);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:10px;margin-bottom:20px;font-size:13px;color:var(--g800)}
.k-pbox-hd{display:flex;align-items:center;gap:4px;color:var(--pur)}
.k-pbox-hd b{font-size:14px}
.k-pbox-hd .ic:last-child{color:var(--pur3)}
.k-pbox-t{font-weight:700;font-size:13px;margin-top:6px;color:var(--g900)}
.k-pbox ul{margin:0;padding-left:20px;line-height:1.75}
.k-ptable{border:1px solid var(--g300);border-radius:8px;padding:20px}
.k-pt-row{display:grid;grid-template-columns:123px repeat(var(--cols),1fr);gap:0 12px;align-items:center;padding:8px 0;font-size:14px}
.k-pt-row.top{align-items:start}
.k-pt-hcell{background:var(--g100);border-radius:8px;padding:14px 8px;text-align:center}
.k-pt-hcell p{font-size:14px;color:var(--g900)}

.k-pt-l{color:var(--g900)}
.k-pt-c{color:var(--g900);line-height:1.5;min-width:0}
.k-pt-c>b{font-weight:700;display:block}
.k-pt-c .pd{color:var(--g800);white-space:pre-wrap}
.k-pt-c.ctr{text-align:center;display:flex;justify-content:center}
.k-pt-c .k-btn-dark{width:100%}
.k-dash{color:var(--g400)}
.k-feat-btn{border:0;background:none;padding:2px 6px;border-radius:6px;outline:1px dashed rgba(109,91,255,.5)}

/* FAQ · 정책 */
.k-acc-q{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;font-size:15px;cursor:pointer;color:var(--g900)}
.k-acc-q .ic{transition:transform .2s;color:var(--g700)}
.k-acc-a{display:none;padding:16px;margin-bottom:12px;background:var(--g100);border-radius:8px;font-size:14px;line-height:1.7;color:var(--g700);white-space:pre-wrap}
.k-acc.open .k-acc-a{display:block}
.k-acc.open .k-acc-q .ic{transform:rotate(180deg)}
.k-pol{padding-top:40px}
.k-pol-h{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.k-pol-h h2{font-size:20px;line-height:30px;font-weight:700}
.k-pol-h .ic{transition:transform .2s;color:var(--g700)}
.k-pol.open .k-pol-h .ic{transform:rotate(180deg)}
.k-pol-b{display:none;padding-top:16px;font-size:14px;line-height:1.75;color:var(--g700);white-space:pre-wrap}
.k-pol.open .k-pol-b{display:block}
.k-notice{width:100%;border-collapse:collapse;font-size:13px;white-space:normal}
.k-notice td,.k-notice th{border:1px solid var(--g300);padding:10px 12px;text-align:left;vertical-align:top}
.k-notice th{background:var(--g100);font-weight:500;width:20%;color:var(--g800)}

/* 전문가 정보 */
.k-ex{border:1px solid var(--g300);border-radius:8px;padding:20px}
.k-ex-top{display:flex;justify-content:space-between;align-items:center}
.k-ex-stats{display:flex;gap:12px;margin-top:20px}
.k-ex-stats div{flex:1;background:var(--g100);border-radius:8px;padding:8px 0;text-align:center}
.k-ex-stats p{font-size:12px;color:var(--g600);line-height:19px}
.k-ex-stats b{font-size:14px;font-weight:700;color:var(--g900)}
.k-ex-intro{margin-top:12px;background:var(--g100);border-radius:8px;padding:16px 16px 12px}
.k-ex-intro .k-collapse{max-height:120px}
.k-ex-intro .k-collapse::after{background:linear-gradient(rgba(250,250,252,0),#FAFAFC);height:60px}
.k-ex-intro p{font-size:14px;line-height:1.75;color:var(--g800);white-space:pre-wrap}
.k-more.sm{border:0;height:24px;margin-top:4px;font-size:12px;background:transparent}

/* 리뷰 */
.k-rv-h{display:flex;align-items:center;gap:4px}
.k-rv-h .ic{color:var(--g500)}
.k-rv-sum{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:20px;font-weight:700}
.k-rv-sum>span{font-size:13px;font-weight:400;color:var(--g600)}
.k-rv-empty{margin-top:8px;padding:48px 0;text-align:center;color:var(--g500);font-size:14px;background:var(--g100);border-radius:8px}

.k-rv-item .k-rv-text{max-height:none;-webkit-line-clamp:unset;display:block}

/* 사이드 패키지 */
.k-pk-tabs{display:flex;border:1px solid var(--g300);border-bottom:0;border-radius:8px 8px 0 0;overflow:hidden}
.k-pk-tabs button{flex:1;height:50px;border:0;background:transparent;font-size:16px;color:var(--g600);border-bottom:1px solid var(--g300);padding:0}
.k-pk-tabs button.on{color:var(--g900);font-weight:700;border-bottom:2px solid var(--g900)}
.k-pk-body{border:1px solid var(--g300);border-top:0;border-radius:0 0 8px 8px;padding:20px}
.k-pk-body.solo{border-top:1px solid var(--g300);border-radius:8px}
.k-pk-price{display:flex;align-items:baseline;gap:4px}

.k-pk-price>span{font-size:12px;color:var(--g600)}
.k-pk-sub{font-size:12px;color:var(--g600);display:flex;align-items:center;gap:2px;margin-top:4px}
.k-pk-title{font-size:14px;font-weight:700;color:var(--g800);margin-top:12px;line-height:21px}
.k-pk-desc{font-size:14px;color:var(--g700);line-height:1.5;margin-top:2px;white-space:pre-wrap}
.k-pk-list{margin:20px 0 16px;display:flex;flex-direction:column;gap:5px}
.k-pk-list div{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--g600);min-height:21px}
.k-pk-list em{font-style:normal;color:var(--g900)}
.k-pk-list .ic{color:var(--g900)}
.k-pk-body .lg+.lg{margin-top:8px}
.k-pk-note{background:var(--g100);border-radius:8px;padding:12px;font-size:12px;color:var(--g500);line-height:19px}
.k-report{font-size:12px;color:var(--g500);display:flex;align-items:center;gap:4px;padding:4px 2px}
.k-ft{border-top:1px solid var(--g200);padding:36px 0 56px;min-width:1200px;color:var(--g600);font-size:13px}
.k-ft-in{display:flex;justify-content:space-between;align-items:flex-start}
.k-ft b{color:var(--g900);font-size:14px}
.k-ft-links{display:flex;gap:20px}
.k-ft-c{margin-top:24px;font-size:12px;color:var(--g500)}

/* ============ 목록 화면 ============ */
.l-wrap{width:1200px;margin:0 auto;padding:0 16px 80px}
.l-head{padding:36px 0 28px;display:flex;align-items:baseline;gap:10px}
.l-head h2{font-size:24px;font-weight:700}
.l-head p{font-size:14px;color:var(--g600)}
.l-body{display:flex;gap:40px}

.l-main{flex:1;min-width:0}
.l-filters{display:flex;flex-wrap:wrap;gap:8px}
.l-fchip{height:36px;padding:0 14px;border:1px solid var(--g300);border-radius:999px;display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--g800);background:#fff;white-space:nowrap}
.l-fchip.prime{font-weight:800;font-style:italic;letter-spacing:-.3px}
.l-sort{display:flex;justify-content:flex-end;align-items:center;gap:2px;font-size:13px;color:var(--g700);margin:16px 0 18px}
.l-grid{display:grid;grid-template-columns:repeat(4,214px);gap:36px 24px}
.l-card{position:relative;width:214px}
.l-img{width:214px;height:160px;border-radius:8px;background:var(--g200)}
.l-img img{width:100%;height:100%;object-fit:cover}
.l-heart{position:absolute;top:8px;right:8px;color:#fff;z-index:3;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.l-title{margin-top:12px;font-size:14px;font-weight:700;line-height:21px;color:var(--g900);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px;word-break:keep-all}
.l-rate{display:flex;align-items:center;gap:2px;font-size:13px;line-height:19px}

.l-price{font-size:14px;line-height:21px;color:var(--g900)}
.l-seller{font-size:12px;color:var(--g600);margin-top:8px;line-height:18px}
.l-badges{display:flex;gap:6px;margin-top:12px}
.l-badges>span{height:20px;padding:0 4px;border-radius:4px;background:var(--g200);font-size:12px;color:var(--g700);display:inline-flex;align-items:center;gap:2px}

.l-card.mine::before{content:"";position:absolute;inset:-10px;border:2px solid var(--yel);border-radius:12px;pointer-events:none}
.l-mine-tag{position:absolute;top:-30px;left:-10px;background:var(--yel);font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;color:#16171A}
.l-dummy .l-title,.l-dummy .l-price,.l-dummy .l-seller{color:var(--g500)}

/* ============ 모바일 ============ */
.mo-wrap{display:flex;flex-direction:column;align-items:center;padding:28px 0 60px}

.mo-crumb{font-size:14px;color:var(--g600);display:flex;align-items:center;gap:2px}
.mo-seller{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--g700)}
.mo-title{font-size:20px;font-weight:600;line-height:1.5;margin-top:12px;color:var(--g900);word-break:keep-all}
.mo-rate{display:flex;gap:4px;align-items:center;margin-top:12px;font-size:14px}
.mo-rate>span{color:var(--g600)}
.mo-pk-tabs{display:flex;border-bottom:1px solid var(--g300);margin-top:8px}
.mo-pk-tabs button{flex:1;height:50px;border:0;background:none;font-size:16px;color:var(--g600);border-bottom:2px solid transparent;margin-bottom:-1px}
.mo-pk-tabs button.on{color:var(--g900);font-weight:600;border-bottom-color:var(--g900)}
.mo-pk{padding:24px 20px 28px}
.mo-price{display:flex;align-items:baseline;gap:4px}
.mo-price b{font-size:20px;font-weight:700}
.mo-price>span{font-size:13px;color:var(--g600)}
.mo-fee{font-size:12px;color:var(--g500);margin-top:4px}
.mo-pk-title{font-size:15px;font-weight:700;margin-top:20px}
.mo-pk-desc{font-size:15px;color:var(--g700);margin-top:6px;line-height:1.55;white-space:pre-wrap}
.mo-pk-list{margin-top:20px;background:var(--g100);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.mo-pk-list div{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--g700)}
.mo-pk-list em{font-style:normal;color:var(--g900)}
.mo-gap{height:8px;background:var(--g200)}
.mo-sec{padding:32px 20px 8px}
.mo-sec h2{font-size:20px;font-weight:700;margin-bottom:16px}
.mo-pf-row{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px;scrollbar-width:none}
.mo-pfc{flex:0 0 160px;cursor:pointer;min-width:0}
.mo-pfc-img{position:relative;width:160px;height:160px;border-radius:8px;overflow:hidden;background:var(--g200)}

function checkImg(kind, m) {
  if (!m || !m.w) return ['', ''];
  const { w, h } = m, r = w / h; const fmtOK = /jpe?g|png/i.test(m.type || m.name || '');
  if (kind === 'thumbs') {
    if (Math.abs(r - 4 / 3) > 0.02) return ['warn', `비율 ${(r).toFixed(2)}:1 → 4:3 아님 (잘려 보임)`];
    if (w < 652) return ['warn', '652×488보다 작음 (흐릿)'];
    if (!fmtOK) return ['warn', 'JPG/PNG로 올려야 해요'];
    return w >= 1304 ? ['ok', '4:3 · 2배수 ✓'] : ['ok', '규격 ✓ (2배수면 더 선명)'];
  }
  if (kind === 'details') {
    if (w < 652) return ['warn', '가로 652px 미만 (규정 미달)'];
    if (h > 3000) return ['warn', '세로 3000px 초과 → 잘라서 올려야 해요'];
    if (w < 715) return ['info', '715px보다 작아 살짝 흐릴 수 있음'];
    return ['ok', w > 1440 ? '규격 ✓ · 1430px로 줄여 표시됨' : '규격 ✓'];
  }
  if (kind === 'pfcover') {
    if (Math.abs(r - 1) > 0.02) return ['warn', '1:1 정사각형이 아님'];
    if (w < 600) return ['warn', '600px 미만 (규정 미달)'];
    return w >= 1400 ? ['ok', '1:1 · 고해상도 ✓'] : ['ok', '1:1 ✓'];
  }
  if (kind === 'pfimg') {
    if (w < 600) return ['warn', '가로 600px 미만 (규정 미달)'];
    if (h > 3000) return ['warn', '세로 3000px 초과 → 분할 필요'];
    return ['ok', '규격 ✓'];
  }
  if (kind === 'avatar') {
    if (Math.abs(r - 1) > 0.02) return ['warn', '1:1이 아님 (원형으로 잘림)'];
    if (w < 100) return ['warn', '100px 미만'];
    return ['ok', '✓'];
  }
  return ['', ''];
}

/* ---------------- 저장소 (IndexedDB) ---------------- */
let DB = null, DOC = 'default';
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
function idbOpen() { return new Promise((res, rej) => { try { const r = indexedDB.open('kmong-preview', 1); r.onupgradeneeded = () => { const db = r.result; db.createObjectStore('docs'); db.createObjectStore('blobs'); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked')); } catch (e) { rej(e); } }); }
function dbPut(store, key, val) { if (!DB) return Promise.resolve(); try { return reqP(DB.transaction(store, 'readwrite').objectStore(store).put(val, key)).catch(e => { console.warn(e); toast('브라우저 저장 공간이 부족해요 · 내보내기로 저장하세요'); }); } catch (e) { console.warn(e); return Promise.resolve(); } }
function dbDel(store, key) { if (!DB) return Promise.resolve(); try { return reqP(DB.transaction(store, 'readwrite').objectStore(store).delete(key)).catch(() => {}); } catch (e) { return Promise.resolve(); } }
async function dbLoad() {
  const doc = await reqP(DB.transaction('docs').objectStore('docs').get(DOC)); if (!doc) return null;
  const st = DB.transaction('blobs').objectStore('blobs'), range = IDBKeyRange.bound(DOC + ':', DOC + ':￿');
  const [keys, vals] = await Promise.all([reqP(st.getAllKeys(range)), reqP(st.getAll(range))]);
  return { state: doc.state, blobs: keys.map((k, i) => ({ id: String(k).slice(DOC.length + 1), ...vals[i] })) };
}
const blobRec = m => ({ blob: m.blob, w: m.w, h: m.h, name: m.name, size: m.size, type: m.type });
async function persistAll() { if (!DB) return; for (const [id, m] of Object.entries(IMGS)) await dbPut('blobs', DOC + ':' + id, blobRec(m)); await dbPut('docs', DOC, { state: S, savedAt: Date.now() }); }
function referenced() { const s = new Set([...S.thumbs, ...S.details, ...S.compare]); if (S.avatar) s.add(S.avatar); S.portfolios.forEach(p => { if (p.cover) s.add(p.cover); p.images.forEach(i => s.add(i)); }); return s; }
function gc() { const ref = referenced(); for (const id of Object.keys(IMGS)) if (!ref.has(id) && !PENDING.has(id)) { URL.revokeObjectURL(IMGS[id].url); delete IMGS[id]; dbDel('blobs', DOC + ':' + id); } }
let saveT; function scheduleSave() { clearTimeout(saveT); saveT = setTimeout(saveNow, 400); }
async function saveNow() { gc(); if (DB) await dbPut('docs', DOC, { state: S, savedAt: Date.now() }); }
function commit() { renderAll(); scheduleSave(); }

/* ---------------- 이미지 추가/교체 ---------------- */
function dims(url) { return new Promise(r => { const i = new Image(); i.onload = () => r({ w: i.naturalWidth, h: i.naturalHeight }); i.onerror = () => r({ w: 0, h: 0 }); i.src = url; }); }
async function addImage(file) {
  const id = uid(), url = URL.createObjectURL(file); PENDING.add(id);
  const { w, h } = await dims(url);
  IMGS[id] = { url, blob: file, w, h, name: file.name || 'image', size: file.size, type: file.type };
  dbPut('blobs', DOC + ':' + id, blobRec(IMGS[id]));
  return id;
}
function listRef(t) { if (t === 'thumbs') return S.thumbs; if (t === 'details') return S.details; if (t === 'compare') return S.compare; if (t === 'pf') return S.portfolios; if (t.startsWith('pfimg:')) return pfById(t.slice(6))?.images; return null; }
function pickFiles(multiple = true) { return new Promise(res => { const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = multiple; inp.onchange = () => res([...inp.files]); inp.oncancel = () => res([]); inp.click(); }); }
async function addFiles(target, files) {
  files = files.filter(f => /^image\//.test(f.type));
  if (!files.length) { toast('이미지 파일만 올릴 수 있어요'); return; }
  const ids = []; for (const f of files) ids.push(await addImage(f));
  if (target === 'avatar') S.avatar = ids[0];
  else if (target.startsWith('pfcover:')) { const p = pfById(target.slice(8)); if (p) { p.cover = ids[0]; p.images.push(...ids.slice(1)); } }
  else if (target === 'pfnew') { const p = mkPF('새 포트폴리오 ' + (S.portfolios.length + 1), '업종', '고객사명'); p.tags = []; p.cover = ids[0]; p.images = ids.slice(1); S.portfolios.push(p); UI.pfOpen = p.id; UI.allPF = false; }
  else { const L = listRef(target); if (L) L.push(...ids); }
  ids.forEach(id => PENDING.delete(id));
  commit();
  if (target === 'pfnew') $('#pf-ov').scrollTop = 0;
  const msgs = [];
  ids.forEach((id, j) => { const k = target === 'pfnew' ? (j === 0 ? 'pfcover' : 'pfimg') : kindOf(target); const [l, t] = checkImg(k, IMGS[id]); if (l === 'warn') msgs.push(t); });
  toast(msgs.length ? '⚠ ' + msgs[0] + (msgs.length > 1 ? ` 외 ${msgs.length - 1}건` : '') : `${ids.length}장 올렸어요`);
}
async function replaceAt(t, i, file) {
  if (!/^image\//.test(file.type)) { toast('이미지 파일만 올릴 수 있어요'); return; }
  const id = await addImage(file);
  if (t === 'avatar') S.avatar = id;
  else if (t.startsWith('pfcover:')) { const p = pfById(t.slice(8)); if (p) p.cover = id; }
  else { const L = listRef(t); if (L) L[i] = id; }
  PENDING.delete(id); commit();
  const [l, txt] = checkImg(kindOf(t), IMGS[id]); toast(l === 'warn' ? '⚠ ' + txt : t === 'avatar' ? '프로필 이미지를 적용했어요' : t.startsWith('pfcover:') ? '커버 이미지를 적용했어요' : '교체했어요');
}
function move(t, from, to) { const L = listRef(t); if (!L || to < 0 || to >= L.length || from === to) return; const [x] = L.splice(from, 1); L.splice(to, 0, x); commit(); }

/* ---------------- 내보내기 / 초기화 ---------------- */
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
function dataURLtoBlob(d) { const i = d.indexOf(','); const head = d.slice(0, i), body = d.slice(i + 1); const mime = (head.match(/data:([^;]+)/) || [])[1] || 'image/png'; const bin = atob(body); const u = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k); return new Blob([u], { type: mime }); }
async function exportHTML(reportMode) {
  toast('파일을 만드는 중이에요…');
  const images = {};
  for (const id of referenced()) { const m = IMGS[id]; if (!m) continue; images[id] = { data: await blobToDataURL(m.blob), w: m.w, h: m.h, name: m.name, size: m.size, type: m.type }; }
  const st = JSON.parse(JSON.stringify(S)); st.ui.report = !!reportMode; st.ui.edit = false; st.ui.panel = !reportMode;
  const payload = { docId: 'exp-' + Date.now().toString(36), savedAt: new Date().toISOString(), state: st, images };
  const doc = new DOMParser().parseFromString(PRISTINE, 'text/html');
  doc.getElementById('embedded-state').textContent = JSON.stringify(payload).replace(/</g, '\\u003c');
  const html = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
  const d = new Date(), name = `kmong-preview-${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}${reportMode ? '-보고용' : ''}.html`;
  const u = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 5000);
  toast(`내보냈어요 · ${name} (${fmtSize(html.length)})`);
}
async function resetAll() {
  if (DB) { try { await reqP(DB.transaction('docs', 'readwrite').objectStore('docs').delete(DOC)); await reqP(DB.transaction('blobs', 'readwrite').objectStore('blobs').delete(IDBKeyRange.bound(DOC + ':', DOC + ':￿'))); } catch (e) { console.warn(e); } }

/* ---------------- 토스트 ---------------- */
let toastT; function toast(msg, action) {
  const t = $('#toast'); t.textContent = msg; t.classList.toggle('act', !!action);
  if (action) { const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { t.classList.remove('show', 'act'); action.fn(); }; t.appendChild(b); }
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show', 'act'), action ? 6000 : 2600);
}
/* 삭제 + 되돌리기 */
let UNDO = null;
function finalizeUndo() { if (!UNDO) return; clearTimeout(UNDO.timer); UNDO.removed.forEach(r => PENDING.delete(r.id)); UNDO = null; scheduleSave(); }
function delItems(t, idxs) {
  const L = listRef(t); if (!L || !idxs.length) return;
  finalizeUndo();
  const removed = [...new Set(idxs)].filter(i => i >= 0 && i < L.length).sort((a, b) => b - a).map(i => ({ i, id: L[i] }));
  removed.forEach(r => { L.splice(r.i, 1); PENDING.add(r.id); UI.sel.delete(r.id); });
  UNDO = { t, removed, timer: setTimeout(finalizeUndo, 6500) };
  commit();
  toast(`${removed.length}장 삭제했어요`, { label: '되돌리기', fn: undoDelete });
}
function undoDelete() {
  if (!UNDO) return; clearTimeout(UNDO.timer);
  const L = listRef(UNDO.t);
  if (L) [...UNDO.removed].sort((a, b) => a.i - b.i).forEach(r => L.splice(Math.min(r.i, L.length), 0, r.id));
  UNDO.removed.forEach(r => PENDING.delete(r.id)); UNDO = null; commit(); toast('되돌렸어요');
}

/* ---------------- 이벤트 ---------------- */
const ACT = {
  view: d => { S.ui.view = d.v; UI.mpf = null; commit(); $('#stage').scrollTop = 0; },
  'toggle-edit': () => { S.ui.edit = !S.ui.edit; commit(); toast(S.ui.edit ? '점선 표시된 글자를 클릭해서 바로 고치세요' : '텍스트 편집을 마쳤어요'); },
  'toggle-guide': () => { S.ui.guide = !S.ui.guide; commit(); },
  'toggle-fit': () => { S.ui.fit = !S.ui.fit; commit(); },
  'toggle-report': () => { S.ui.report = !S.ui.report; commit(); if (S.ui.report) toast('보고 모드 · 편집 도구가 숨겨졌어요 (Esc로 해제)'); },
  'toggle-panel': () => { S.ui.panel = !S.ui.panel; commit(); },
  'open-guide': () => { UI.guide = true; renderOverlays(); },
  'close-guide': () => { UI.guide = false; renderOverlays(); },
  add: async d => { const f = await pickFiles(true); if (f.length) addFiles(d.t, f); },
  replace: async d => { const f = await pickFiles(false); if (f[0]) replaceAt(d.t, +d.i, f[0]); },
  del: d => delItems(d.t, [+d.i]),
  'sort-open': d => { UI.sort = d.t; UI.sel = new Set(); renderOverlays(); $('#so-ov').scrollTop = 0; },
  'sort-tab': d => { UI.sort = d.t; UI.sel = new Set(); renderOverlays(); },
  'sort-close': () => { UI.sort = null; UI.sel = new Set(); renderOverlays(); },
  'sort-del-sel': () => { const L = S[UI.sort]; delItems(UI.sort, L.map((id, i) => UI.sel.has(id) ? i : -1).filter(i => i >= 0)); },
  'sort-del-all': () => delItems(UI.sort, S[UI.sort].map((_, i) => i)),
  up: d => move(d.t, +d.i, +d.i - 1),
  down: d => move(d.t, +d.i, +d.i + 1),
  hero: d => { UI.hero = clamp(UI.hero + (+d.d), 0, galCount() - 1); renderView(); },
  pfcar: d => { UI.pf = Math.max(0, UI.pf + (+d.d)); renderView(); },
  pkg: d => { UI.pkg = +d.i; renderView(); },
  mpkg: d => { UI.mpkg = +d.i; renderView(); },
  more: d => { S.ui.open[d.key] = !S.ui.open[d.key]; commit(); },
  acc: d => { S.ui.open[d.key] = !S.ui.open[d.key]; commit(); },
  goto: d => { const el = document.getElementById('sec-' + d.sec); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  'pf-open': d => { UI.pfOpen = d.id; UI.allPF = false; renderOverlays(); $('#pf-ov').scrollTop = 0; },
  'pf-close': () => { UI.pfOpen = null; renderOverlays(); },
  'pf-new': async () => { const f = await pickFiles(true); if (f.length) addFiles('pfnew', f); },
  'pf-new-empty': () => { const p = mkPF('새 포트폴리오 ' + (S.portfolios.length + 1), '업종', '고객사명'); p.tags = []; S.portfolios.push(p); UI.pfOpen = p.id; UI.allPF = false; commit(); $('#pf-ov').scrollTop = 0; },
  'pf-del': d => { const i = S.portfolios.findIndex(p => p.id === d.id); if (i < 0) return; S.portfolios.splice(i, 1); if (UI.pfOpen === d.id) UI.pfOpen = S.portfolios[Math.min(i, S.portfolios.length - 1)]?.id || null; commit(); toast('포트폴리오를 삭제했어요'); },
  'pf-addimg': async d => { const f = await pickFiles(true); if (f.length) addFiles('pfimg:' + d.id, f); },
  'pf-cover-pick': async d => { const f = await pickFiles(false); if (f[0]) replaceAt('pfcover:' + d.id, 0, f[0]); },
  'pf-cover-del': d => { const p = pfById(d.id); if (p) { p.cover = null; commit(); } },
  'pf-setcover': d => { const p = pfById(d.id); if (!p) return; const i = +d.i, id = p.images[i]; p.images.splice(i, 1); if (p.cover) p.images.splice(i, 0, p.cover); p.cover = id; commit(); toast('커버로 지정했어요'); },
  'pf-move': d => { const i = S.portfolios.findIndex(p => p.id === UI.pfOpen); move('pf', i, i + (+d.d)); },
  'pf-like': () => { UI.liked = !UI.liked; renderOverlays(); },
  'all-pf': () => { UI.allPF = true; UI.pfOpen = null; renderOverlays(); $('#all-ov').scrollTop = 0; },
  'all-close': () => { UI.allPF = false; renderOverlays(); },
  'mpf-open': d => { UI.mpf = d.id; renderView(); const p = $('.mo-pfv-scroll'); if (p) p.scrollTop = 0; },
  'mpf-close': () => { UI.mpf = null; renderView(); },
  feat: d => { const p = S.packages[+d.p]; p.feats[+d.f] = !p.feats[+d.f]; commit(); },
  pkgcount: d => { S.ui.pkgCount = +d.n; commit(); },
  'faq-add': () => { S.faq.push({ q: '새 질문을 입력하세요', a: '답변을 입력하세요.' }); commit(); },
  'faq-del': d => { S.faq.splice(+d.i, 1); commit(); },
  export: d => exportHTML(d.r === '1'),
  reset: () => resetAll(),
  'avatar-pick': async () => { const f = await pickFiles(false); if (f[0]) replaceAt('avatar', 0, f[0]); },
  'avatar-del': () => { S.avatar = null; commit(); }
};
document.addEventListener('click', e => {
  if (e.target.closest('.ek[contenteditable]')) return;
  const a = e.target.closest('[data-act]'); if (!a || a.disabled) return;
  e.preventDefault();
  if (a.dataset.confirm && !a.classList.contains('armed')) {
    a.classList.add('armed'); a.dataset.html = a.innerHTML; a.textContent = '한 번 더 누르면 삭제';
    if (a.dataset.act === 'reset') a.textContent = '한 번 더 누르면 초기화 (이미지도 지워져요)';
    setTimeout(() => { if (a.isConnected && a.classList.contains('armed')) { a.classList.remove('armed'); a.innerHTML = a.dataset.html; } }, 2600);
    return;
  }
  const fn = ACT[a.dataset.act]; if (fn) fn(a.dataset, a, e);
});
document.addEventListener('change', e => {
  const ds = e.target.dataset || {};
  if (ds.opt) { S.ui[ds.opt] = e.target.checked; commit(); return; }
  if (ds.selId) { e.target.checked ? UI.sel.add(ds.selId) : UI.sel.delete(ds.selId); renderOverlays(); return; }
  if (ds.selAll) { UI.sel = e.target.checked ? new Set(S[UI.sort]) : new Set(); renderOverlays(); }
});
document.addEventListener('input', e => {
  const el = e.target.closest?.('.ek'); if (!el) return;
  const path = el.dataset.k, val = el.innerText.replace(/ /g, ' ').replace(/\n$/, '');
  setP(path, val);
  $$(`[data-k="${CSS.escape(path)}"]`).forEach(n => { if (n === el) return; if (n.dataset.fmt === 'desc') n.innerHTML = fmtDesc(getP(path)); else n.textContent = getP(path); });
  scheduleSave();
});
document.addEventListener('focusout', e => {
  const el = e.target.closest?.('.ek'); if (!el) return;
  // 패널의 제목 목록 등 보조 표시 갱신
  clearTimeout(window.__pt); window.__pt = setTimeout(() => { if (!document.activeElement?.closest?.('.ek')) $('#panel').innerHTML = renderPanel(); }, 150);
});
document.addEventListener('paste', e => {
  const el = e.target.closest?.('.ek[contenteditable]'); if (!el || PT_OK) return;
  e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
});
document.addEventListener('keydown', e => {
  const ek = e.target.closest?.('.ek[contenteditable]');
  if (ek) { if (e.key === 'Enter' && !ek.dataset.ml) { e.preventDefault(); ek.blur(); } if (e.key === 'Escape') ek.blur(); return; }
  if (e.key === 'Escape') {
    if (UI.sort) ACT['sort-close']();
    else if (UI.guide) ACT['close-guide']();
    else if (UI.pfOpen) ACT['pf-close']();
    else if (UI.allPF) ACT['all-close']();
    else if (UI.mpf) ACT['mpf-close']();
    else if (S.ui.report) ACT['toggle-report']();
  }
});
// 오버레이 바깥 클릭 시 닫기
['pf-ov', 'all-ov', 'gd-ov', 'so-ov'].forEach(id => document.getElementById(id).addEventListener('mousedown', e => {
  if (e.target.id !== id) return;
  if (id === 'pf-ov') ACT['pf-close'](); else if (id === 'all-ov') ACT['all-close'](); else if (id === 'so-ov') ACT['sort-close'](); else ACT['close-guide']();
}));

/* 드래그 앤 드롭: 파일 업로드 + 패널 순서 변경 */
let DRAG = null;
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
const clearOver = () => $$('.dz-over,.drag-over').forEach(n => n.classList.remove('dz-over', 'drag-over'));
document.addEventListener('dragstart', e => {
  const it = e.target.closest?.('[data-drag]'); if (!it || !canEdit()) return;
  DRAG = { t: it.dataset.drag, i: +it.dataset.idx }; it.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'reorder');
});
document.addEventListener('dragend', () => { $$('.dragging').forEach(n => n.classList.remove('dragging')); DRAG = null; clearOver(); });
document.addEventListener('dragover', e => {
  if (hasFiles(e)) {
    e.preventDefault(); const z = e.target.closest('[data-drop]');
    $$('.dz-over').forEach(n => { if (n !== z) n.classList.remove('dz-over'); }); if (z) z.classList.add('dz-over');
    e.dataTransfer.dropEffect = z && canEdit() ? 'copy' : 'none';
  } else if (DRAG) {
    const it = e.target.closest('[data-drag]'); if (!it || it.dataset.drag !== DRAG.t) return;
    e.preventDefault(); $$('.drag-over').forEach(n => { if (n !== it) n.classList.remove('drag-over'); }); it.classList.add('drag-over');
  }
});
document.addEventListener('dragleave', e => { if (!e.relatedTarget || !document.contains(e.relatedTarget)) clearOver(); });
document.addEventListener('drop', e => {
  if (hasFiles(e)) {
    e.preventDefault(); const z = e.target.closest('[data-drop]'); clearOver(); if (!z || !canEdit()) return;
    const files = [...e.dataTransfer.files].filter(f => /^image\//.test(f.type));
    if (!files.length) { toast('이미지 파일만 올릴 수 있어요'); return; }
    const t = z.dataset.drop;
    if (z.dataset.idx != null && files.length === 1) replaceAt(t, +z.dataset.idx, files[0]);
    else addFiles(t, files);
  } else if (DRAG) {
    const it = e.target.closest('[data-drag]'); clearOver();
    if (it && it.dataset.drag === DRAG.t) { e.preventDefault(); move(DRAG.t, DRAG.i, +it.dataset.idx); }
    DRAG = null;
  }
});
$('#stage').addEventListener('scroll', onStageScroll, { passive: true });
window.addEventListener('resize', fit);

/* ---------------- 시작 ---------------- */
(async function init() {
  let emb = null;
  try { emb = JSON.parse(document.getElementById('embedded-state').textContent); } catch (e) { emb = null; }
  DOC = (emb && emb.docId) || 'default';
  try { DB = await idbOpen(); } catch (e) { DB = null; }
  let loaded = null;
  if (DB) { try { loaded = await dbLoad(); } catch (e) { console.warn(e); } }
  if (loaded) {
    S = merge(defaults(), loaded.state);
    for (const r of loaded.blobs) if (r.blob) IMGS[r.id] = { url: URL.createObjectURL(r.blob), blob: r.blob, w: r.w, h: r.h, name: r.name, size: r.size, type: r.type };
  } else if (emb && emb.state) {
    S = merge(defaults(), emb.state);
    for (const [id, m] of Object.entries(emb.images || {})) { try { const blob = dataURLtoBlob(m.data); IMGS[id] = { url: URL.createObjectURL(blob), blob, w: m.w, h: m.h, name: m.name, size: m.size, type: m.type }; } catch (e) { console.warn(e); } }
    persistAll();
  } else S = defaults();
  renderAll();
  if (S.ui.report) toast('보고 모드로 열렸어요 · 왼쪽 아래 버튼이나 Esc로 편집 화면 전환');
})();
</script>
